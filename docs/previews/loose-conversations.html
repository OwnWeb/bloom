<div class="demo">
  <div class="demo-head">
    <span class="demo-title">Conversation workspaces in Bloom</span><span class="demo-tag">Interactive design concept</span>
    <nav class="scenario-nav" aria-label="Explore mockups">

  </div>

 {id:1,name:'Planning the next Bloom release',kind:'conversation',status:'unread',pinned:true,colour:'#f7ae5c',archived:false,age:'4m',messages:[{role:'user',text:'I have several changes ready. Help me decide what belongs in the next release.'},{role:'agent',text:'Let us make a short release candidate list first. I would group the changes by what a user can notice, then check which ones need migration or release notes.'}]},

document.addEventListener('dragstart',e=>{let row=e.target.closest('.side-row[draggable="true"]');if(row)e.dataTransfer.setData('text/plain',row.dataset.id)});
document.addEventListener('dragover',e=>{if(e.target.closest('.side-row[draggable="true"]'))e.preventDefault()});
document.addEventListener('drop',e=>{let row=e.target.closest('.side-row[draggable="true"]');if(!row)return;e.preventDefault();let from=workspace(e.dataTransfer.getData('text/plain')),to=workspace(row.dataset.id);if(!from||!to||from.id===to.id||from.kind!=='conversation'||to.kind!=='conversation')return;let index=workspaces.indexOf(from);workspaces.splice(index,1);workspaces.splice(workspaces.indexOf(to),0,from);renderSidebar();toast('Conversation reordered.')});
const fileInput=document.createElement('input');fileInput.id='fileInput';fileInput.type='file';fileInput.hidden=true;fileInput.addEventListener('change',()=>{state.attachment=fileInput.files?.[0]?.name||null;if(state.attachment)toast('Attached '+state.attachment);if($('overlay').dataset.create){state.draft=$('createPrompt')?.value||state.draft;renderOverlay()}});document.body.append(fileInput);
render();$('overlay').dataset.create='true';renderOverlay();
</script>
</body>
</html>
